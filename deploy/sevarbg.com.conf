# Host nginx vhost (Ubuntu, /etc/nginx/sites-available/sevarbg.com) for the
# sevar-web container published on 127.0.0.1:24917 (docker-compose.yml).
# Install:  cp deploy/sevarbg.com.conf /etc/nginx/sites-available/sevarbg.com
#           ln -s /etc/nginx/sites-available/sevarbg.com /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# HTTPS:    certbot --nginx -d sevarbg.com -d www.sevarbg.com
server {
    listen 80;
    server_name sevarbg.com www.sevarbg.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:24917;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
