<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SEVAR — Администрация</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=3">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <img src="../assets/img/brand/sevar-logo.png" alt="SEVAR" width="120" height="48">
      <h1>Администрация</h1>
      <label for="pw">Парола</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <p class="err" id="loginErr" hidden></p>
      <button class="btn primary" type="submit">Вход</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="side">
      <a class="brand" href="#/inquiries"><img src="../assets/img/brand/sevar-logo.png" alt="SEVAR" width="110" height="44"></a>
      <nav id="nav">
        <a href="#/inquiries" data-route="inquiries">Заявки <b id="bdgInq" hidden></b></a>
        <a href="#/orders" data-route="orders">Поръчки <b id="bdgOrd" hidden></b></a>
        <a href="#/b2b" data-route="b2b">B2B заявки <b id="bdgB2b" hidden></b></a>
        <a href="#/quotes" data-route="quotes">Оферти <b id="bdgQuo" hidden></b></a>
        <a href="#/labels" data-route="labels">Етикети <b id="bdgLab" hidden></b></a>
      </nav>
      <div class="side-foot">
        <a href="../index.html" target="_blank" rel="noopener">Към сайта ↗</a>
        <button type="button" id="logout" class="link">Изход</button>
      </div>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="admin.js?v=12"></script>
</body>
</html>
